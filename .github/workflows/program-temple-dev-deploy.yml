name: Deploy to Dev (program-temple)

# 개발 서버(노트북) 배포: develop 에 push(= PR merge)될 때만 실행한다.
# 보안: pull_request 이벤트는 절대 넣지 않는다. (공개 레포 + self-hosted runner)
on:
  push:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  deploy-dev:
    runs-on: dev-laptop
    concurrency:
      group: deploy-program-temple-dev
      cancel-in-progress: false
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          $ErrorActionPreference = 'Continue'
          docker build `
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" `
            -t "program-temple-dev:${{ github.run_number }}" .
          if ($LASTEXITCODE -ne 0) { Write-Host "build failed"; exit 1 }

      - name: Deploy (replace container)
        run: |
          $ErrorActionPreference = 'Continue'

          # DB 접속 정보 파일(노트북에만 있고 저장소에는 없음)
          $envFile = 'C:\dev-env\program-temple.env'
          if (-not (Test-Path $envFile)) {
            Write-Host "$envFile 파일이 없습니다. 개발용 DB 접속 정보 파일을 먼저 만들어야 합니다."
            exit 1
          }

          $old = docker ps -aq --filter "name=^program-temple$"
          if ($old) {
            docker stop program-temple | Out-Null
            docker rm program-temple | Out-Null
          }
          docker run -d `
            --name program-temple `
            --restart unless-stopped `
            --network nirvana `
            --env-file $envFile `
            -e SPRING_PROFILES_ACTIVE=aws `
            -e JAVA_TOOL_OPTIONS="-Xmx384m" `
            -p 127.0.0.1:8081:8081 `
            "program-temple-dev:${{ github.run_number }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "docker run failed"; exit 1 }

          # 이 레포에서 만든 오래된 이미지만 정리 (24시간 이상, 안 쓰는 것)
          docker image prune -a -f --filter "until=24h" --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}" | Out-Null

          # 배포 확인: 최대 120초 동안 5초마다 헬스체크 (DB 연결이 안 되면 DOWN(503)이라 실패)
          for ($i = 1; $i -le 24; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:8081/actuator/health
              if ($r.StatusCode -eq 200) {
                Write-Host "program-temple is up"
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          Write-Host "program-temple did not become healthy. last logs:"
          docker logs --tail 50 program-temple
          exit 1
